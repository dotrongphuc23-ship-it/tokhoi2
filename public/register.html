<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Cổng Tiểu Học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="common.css" rel="stylesheet">
</head>
<body class="auth-body">
    <main class="container py-4">
        <div class="card auth-card shadow-lg p-4 mx-auto bg-white">
            <div class="text-center mb-4">
                <span class="fs-1" aria-hidden="true">📚</span>
                <h1 class="h4 fw-bold auth-title mt-2">ĐĂNG KÝ THÀNH VIÊN</h1>
            </div>
            
            <form id="regForm">
                <!-- Bước 1: Thông tin cá nhân & Gửi Email -->
                <div id="step1">
                    <div class="mb-3">
                        <label for="role" class="form-label fw-bold">Bạn đăng ký với vai trò gì?</label>
                        <select id="role" class="form-select">
                            <option value="student">🎒 Học sinh / Phụ huynh</option>
                            <option value="teacher">👨‍🏫 Thầy / Cô giáo viên</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="full_name" class="form-label fw-bold">Họ và tên <span class="text-danger">*</span></label>
                        <input type="text" id="full_name" class="form-control" required minlength="2" placeholder="Ví dụ: Lê Bảo">
                    </div>

                    <!-- Box dành riêng cho giáo viên -->
                    <div id="teacherBox" class="d-none bg-light p-3 rounded mb-3 border">
                        <div class="mb-2">
                            <label for="dob" class="form-label fw-bold small">Ngày tháng năm sinh <span class="text-danger">*</span></label>
                            <input type="date" id="dob" class="form-control form-control-sm">
                        </div>
                        <div class="mb-2">
                            <label for="phone" class="form-label fw-bold small">Số điện thoại <span class="text-danger">*</span></label>
                            <input type="tel" id="phone" class="form-control form-control-sm" placeholder="09xxxxxxx">
                        </div>
                        <div class="mb-2">
                            <label for="workplace" class="form-label fw-bold small">Đơn vị công tác <span class="text-danger">*</span></label>
                            <input type="text" id="workplace" class="form-control form-control-sm" placeholder="Trường Tiểu học...">
                        </div>
                        <div class="mb-2">
                            <label for="position" class="form-label fw-bold small">Chức vụ <span class="text-danger">*</span></label>
                            <input type="text" id="position" class="form-control form-control-sm" placeholder="Ví dụ: Giáo viên chủ nhiệm">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="email" class="form-label fw-bold">Địa chỉ Email <span class="text-danger">*</span></label>
                        <input type="email" id="email" class="form-control" required placeholder="name@gmail.com">
                        <small class="text-muted d-block mt-1">Chúng tôi sẽ gửi mã xác thực (OTP) tới email này.</small>
                    </div>

                    <button type="button" id="btnSendOtp" class="btn btn-primary w-100 py-2 fw-bold">Xác thực Email & Tiếp tục</button>
                </div>

                <!-- Bước 2: Nhập OTP & Tạo mật khẩu -->
                <div id="step2" class="d-none">
                    <div class="alert alert-info py-2 px-3 small mb-3">
                        Mã xác thực (OTP) 6 số đã được gửi tới hộp thư: <b id="displayEmail"></b>. Vui lòng kiểm tra (cả hộp thư rác).
                    </div>
                    
                    <div class="mb-3">
                        <label for="otpCode" class="form-label fw-bold">Mã xác thực (OTP) <span class="text-danger">*</span></label>
                        <input type="text" id="otpCode" class="form-control otp-input" maxlength="6" inputmode="numeric" pattern="\d{6}">
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold">Thiết lập mật khẩu <span class="text-danger">*</span></label>
                        <input type="password" id="password" class="form-control" minlength="6" placeholder="Tối thiểu 6 ký tự">
                    </div>

                    <button type="submit" id="btnSubmitReg" class="btn btn-success w-100 py-2 fw-bold">Hoàn tất đăng ký</button>
                    <div class="text-center mt-3 small"><a href="#" id="btnBackToStep1" class="text-decoration-none">← Đổi email / Gửi lại mã</a></div>
                </div>
            </form>
            
            <div class="text-center mt-4 pt-3 border-top small">
                Đã có tài khoản? <a href="login.html" class="fw-bold">Đăng nhập ngay</a>
            </div>
        </div>
    </main>

    <script src="common.js"></script>
    <script>
        const roleSel = document.getElementById('role');
        const teacherBox = document.getElementById('teacherBox');
        const teacherInputs = teacherBox.querySelectorAll('input');

        // Hiện box Giáo viên và gắn required
        roleSel.addEventListener('change', () => {
            const isTeacher = roleSel.value === 'teacher';
            teacherBox.classList.toggle('d-none', !isTeacher);
            teacherInputs.forEach(inp => isTeacher ? inp.setAttribute('required', 'true') : inp.removeAttribute('required'));
        });

        document.getElementById('btnSendOtp').addEventListener('click', async () => {
            const form = document.getElementById('regForm');
            if (!form.checkValidity()) { form.reportValidity(); return; }

            const btn = document.getElementById('btnSendOtp');
            const email = document.getElementById('email').value.trim();
            setBusy(btn, true, 'Đang gửi mã OTP...');
            
            try {
                await api('/api/auth/register-otp', { method: 'POST', redirectOn401: false, json: { email: email } });
                document.getElementById('displayEmail').textContent = email;
                document.getElementById('step1').classList.add('d-none');
                document.getElementById('step2').classList.remove('d-none');
                document.getElementById('otpCode').setAttribute('required', 'true');
                document.getElementById('password').setAttribute('required', 'true');
                document.getElementById('otpCode').focus();
            } catch (err) { notify(err.message); }
            setBusy(btn, false);
        });

        document.getElementById('btnBackToStep1').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('step2').classList.add('d-none');
            document.getElementById('step1').classList.remove('d-none');
            document.getElementById('otpCode').removeAttribute('required');
            document.getElementById('password').removeAttribute('required');
        });

        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSubmitReg');
            setBusy(btn, true, 'Đang đăng ký...');
            try {
                const data = await api('/api/auth/register', {
                    method: 'POST', redirectOn401: false,
                    json: {
                        full_name: document.getElementById('full_name').value,
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                        role: roleSel.value,
                        otp: document.getElementById('otpCode').value,
                        dob: document.getElementById('dob').value,
                        phone: document.getElementById('phone').value,
                        workplace: document.getElementById('workplace').value,
                        position: document.getElementById('position').value
                    }
                });
                notify(data.message, 'success', 4000);
                setTimeout(() => { location.href = 'login.html'; }, 1800);
            } catch (err) {
                notify(err.message);
                setBusy(btn, false);
            }
        });
    </script>
</body>
</html>
