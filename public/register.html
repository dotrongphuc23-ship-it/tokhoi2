<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Cổng Tiểu Học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="common.css" rel="stylesheet">
</head>
<body class="auth-body">
    <main class="container py-4">
        <div class="card auth-card shadow-lg p-4 mx-auto bg-white">
            <div class="text-center mb-4">
                <span class="fs-1" aria-hidden="true">📚</span>
                <h1 class="h4 fw-bold auth-title mt-2">ĐĂNG KÝ THÀNH VIÊN</h1>
            </div>
            <form id="regForm">
                <div class="mb-3">
                    <label for="full_name" class="form-label fw-bold">Họ và tên</label>
                    <input type="text" id="full_name" class="form-control" required minlength="2" maxlength="100" autocomplete="name" placeholder="Ví dụ: Lê Bảo">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">Email</label>
                    <input type="email" id="email" class="form-control" required maxlength="100" autocomplete="username" placeholder="name@gmail.com">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-bold">Mật khẩu</label>
                    <input type="password" id="password" class="form-control" required minlength="6" maxlength="72" autocomplete="new-password" placeholder="Tối thiểu 6 ký tự">
                </div>
                <div class="mb-4">
                    <label for="role" class="form-label fw-bold">Vai trò của bạn</label>
                    <select id="role" class="form-select">
                        <option value="student">🎒 Học sinh / Phụ huynh (đăng nhập ngay)</option>
                        <option value="teacher">👨‍🏫 Thầy / Cô giáo viên (cần BGH duyệt)</option>
                    </select>
                </div>
                <button type="submit" id="btnReg" class="btn btn-brand w-100 py-2 fw-bold">Gửi yêu cầu đăng ký</button>
            </form>
            <div class="text-center mt-3 small">
                Đã có tài khoản? <a href="login.html" class="fw-bold">Đăng nhập ngay</a>
            </div>
        </div>
    </main>
    <script src="common.js"></script>
    <script>
        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnReg');
            setBusy(btn, true, 'Đang gửi...');
            try {
                const data = await api('/api/auth/register', {
                    method: 'POST', redirectOn401: false,
                    json: {
                        full_name: document.getElementById('full_name').value,
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                        role: document.getElementById('role').value
                    }
                });
                notify(data.message, 'success', 4000);
                setTimeout(() => { location.href = 'login.html'; }, 1800);
            } catch (err) {
                notify(err.message);
                setBusy(btn, false);
            }
        });
    </script>
</body>
</html>
