<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân - Cổng Tiểu Học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="common.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-4 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fa fa-arrow-left me-2"></i> Quay lại cổng học tập</a>
            <span class="text-white small" id="userBadge"></span>
        </div>
    </nav>

    <main class="container py-4" style="max-width: 720px;">
        <div class="card p-4 border-0 shadow-sm mb-4">
            <h1 class="h4 fw-bold auth-title mb-1"><i class="fa fa-id-card me-2"></i>Hồ sơ cá nhân</h1>
            <div class="small text-muted mb-4"><span id="roleText"></span> <span id="joinedText"></span></div>

            <form id="profileForm">
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">Email</label>
                    <input type="email" id="email" class="form-control" disabled>
                    <div class="form-text">Email dùng để đăng nhập nên không thể thay đổi.</div>
                </div>
                <div class="mb-3">
                    <label for="full_name" class="form-label fw-bold">Họ và tên <span class="text-danger">*</span></label>
                    <input type="text" id="full_name" class="form-control" required minlength="2" maxlength="100" autocomplete="name">
                </div>

                <div id="teacherFields" class="d-none">
                    <div class="row g-3 mb-3">
                        <div class="col-sm-6">
                            <label for="dob" class="form-label fw-bold">Ngày sinh</label>
                            <input type="date" id="dob" class="form-control">
                        </div>
                        <div class="col-sm-6">
                            <label for="phone" class="form-label fw-bold">Số điện thoại</label>
                            <input type="tel" id="phone" class="form-control" maxlength="20" autocomplete="tel">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="workplace" class="form-label fw-bold">Đơn vị công tác</label>
                        <input type="text" id="workplace" class="form-control" maxlength="255">
                    </div>
                    <div class="mb-3">
                        <label for="position" class="form-label fw-bold">Chức vụ</label>
                        <input type="text" id="position" class="form-control" maxlength="100">
                    </div>
                </div>

                <button type="submit" id="btnSaveProfile" class="btn btn-brand px-4 fw-bold">Lưu thay đổi</button>
            </form>
        </div>

        <div class="card p-4 border-0 shadow-sm">
            <h2 class="h5 fw-bold auth-title mb-3"><i class="fa fa-key me-2"></i>Đổi mật khẩu</h2>
            <form id="passwordForm">
                <div class="mb-3">
                    <label for="current_password" class="form-label fw-bold">Mật khẩu hiện tại</label>
                    <input type="password" id="current_password" class="form-control" required autocomplete="current-password">
                </div>
                <div class="mb-3">
                    <label for="new_password" class="form-label fw-bold">Mật khẩu mới</label>
                    <input type="password" id="new_password" class="form-control" required minlength="6" maxlength="72" autocomplete="new-password" placeholder="Tối thiểu 6 ký tự">
                </div>
                <div class="mb-3">
                    <label for="confirm_password" class="form-label fw-bold">Nhập lại mật khẩu mới</label>
                    <input type="password" id="confirm_password" class="form-control" required minlength="6" maxlength="72" autocomplete="new-password">
                    <div class="form-text">Sau khi đổi, các thiết bị khác đang đăng nhập sẽ phải đăng nhập lại.</div>
                </div>
                <button type="submit" id="btnChangePassword" class="btn btn-brand px-4 fw-bold">Đổi mật khẩu</button>
            </form>
        </div>
    </main>

    <script src="common.js"></script>
    <script>
        const $ = (id) => document.getElementById(id);
        const TEACHER_FIELDS = ['dob', 'phone', 'workplace', 'position'];
        const ROLE_TEXT = { student: '🎒 Học sinh / Phụ huynh', teacher: '👨‍🏫 Giáo viên', admin: '👑 Quản trị viên', master_admin: '👑 Quản trị viên' };

        async function loadProfile() {
            const p = await api('/api/me/profile');
            $('email').value = p.email;
            $('full_name').value = p.full_name || '';
            $('roleText').textContent = ROLE_TEXT[p.role] || p.role;
            $('joinedText').textContent = p.created_at ? '· Tham gia từ ' + new Date(p.created_at).toLocaleDateString('vi-VN') : '';
            $('userBadge').textContent = `Xin chào, ${p.full_name}`;
            const isTeacher = p.role === 'teacher';
            $('teacherFields').classList.toggle('d-none', !isTeacher);
            if (isTeacher) TEACHER_FIELDS.forEach((f) => { $(f).value = p[f] || ''; });
        }

        $('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = $('btnSaveProfile');
            setBusy(btn, true, 'Đang lưu...');
            try {
                const body = { full_name: $('full_name').value };
                if (!$('teacherFields').classList.contains('d-none')) TEACHER_FIELDS.forEach((f) => { body[f] = $(f).value; });
                const data = await api('/api/me/profile', { method: 'PUT', json: body });
                notify(data.message, 'success', 3000);
                await loadProfile();
            } catch (err) { notify(err.message); }
            setBusy(btn, false);
        });

        $('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if ($('new_password').value !== $('confirm_password').value) { notify('Mật khẩu nhập lại không khớp.'); return; }
            const btn = $('btnChangePassword');
            setBusy(btn, true, 'Đang đổi...');
            try {
                const data = await api('/api/me/change-password', {
                    method: 'POST',
                    json: { current_password: $('current_password').value, new_password: $('new_password').value }
                });
                notify(data.message, 'success', 5000);
                e.target.reset();
            } catch (err) { notify(err.message); }
            setBusy(btn, false);
        });

        (async function init() {
            const user = await requireUser();
            if (!user) return;
            try { await loadProfile(); } catch (err) { notify(err.message); }
        })();
    </script>
</body>
</html>
