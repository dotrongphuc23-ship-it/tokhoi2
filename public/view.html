<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Tài Liệu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="common.css" rel="stylesheet">
    <style>
        .star-rating i { cursor: pointer; }
        .preview-frame { width: 100%; height: 600px; }
        @media (max-width: 576px) { .preview-frame { height: 420px; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark px-4 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html"><i class="fa fa-arrow-left me-2"></i> Quay lại cổng học tập</a>
            <span class="text-white small" id="userBadge"></span>
        </div>
    </nav>

    <main class="container py-4">
        <div class="card p-4 border-0 shadow-sm mb-4">
            <div class="d-flex justify-content-between align-items-start mb-3 gap-3">
                <div>
                    <span class="badge bg-primary mb-2 d-none" id="gradeBadge">Khối ...</span>
                    <span class="badge bg-secondary mb-2" id="categoryBadge">...</span>
                    <h1 class="h2 fw-bold text-dark" id="docTitle">Đang tải tên tài liệu...</h1>
                </div>
                <div class="text-end flex-shrink-0 d-flex flex-column align-items-end gap-2">
                    <div class="d-flex align-items-center gap-2">
                        <button class="btn btn-outline-danger btn-sm rounded-pill fw-bold shadow-sm" id="btnReport"><i class="fa fa-flag me-1"></i> Báo lỗi</button>
                        <button class="btn btn-light border btn-sm rounded-circle shadow-sm text-danger d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;" id="btnBookmarkView" title="Lưu tài liệu này"><i class="fa fa-heart fa-regular" id="bookmarkIconView"></i></button>
                    </div>
                    <div>
                        <span class="text-warning fs-5 fw-bold" id="avgRatingDisplay"></span>
                        <div class="small text-muted" id="viewsDisplay"></div>
                    </div>
                </div>
            </div>
            <div class="row text-secondary small mb-4 border-top border-bottom py-2 gy-1">
                <div class="col-md-3"><i class="fa fa-user me-1"></i> Tác giả: <b id="authorDisplay" class="text-dark">...</b></div>
                <div class="col-md-3" id="subjectCol"><i class="fa fa-book me-1"></i> Môn học: <b id="subjectDisplay" class="text-dark">...</b></div>
                <div class="col-md-3" id="weekCol"><i class="fa fa-calendar-week me-1"></i> Tuần học: <b id="weekDisplay" class="text-dark">...</b></div>
                <div class="col-md-3"><i class="fa fa-calendar me-1"></i> Ngày đăng: <b id="dateDisplay" class="text-dark">...</b></div>
            </div>
            <p class="text-muted mb-0" id="descDisplay"></p>
        </div>

        <div class="card p-4 border-0 shadow-sm mb-4">
            <h2 class="h5 fw-bold text-primary mb-3"><i class="fa fa-desktop"></i> Xem trực tiếp nội dung</h2>
            <div id="renderArea" class="text-center">
                <div class="spinner-border text-primary my-5" role="status"><span class="visually-hidden">Đang tải...</span></div>
            </div>
        </div>

        <div class="card p-4 border-0 shadow-sm">
            <h2 class="h5 fw-bold mb-3"><i class="fa fa-comments text-info"></i> Đánh giá và thảo luận</h2>

            <form id="reviewForm" class="mb-4 bg-light p-3 rounded shadow-sm">
                <label class="fw-bold small mb-1">Đánh giá của bạn</label>
                <div class="mb-2 fs-4 star-rating" id="starPicker" role="radiogroup" aria-label="Số sao">
                    <i class="fa fa-star text-warning" data-value="1" role="radio" tabindex="0"></i>
                    <i class="fa fa-star text-warning" data-value="2" role="radio" tabindex="0"></i>
                    <i class="fa fa-star text-warning" data-value="3" role="radio" tabindex="0"></i>
                    <i class="fa fa-star text-warning" data-value="4" role="radio" tabindex="0"></i>
                    <i class="fa fa-star text-warning" data-value="5" role="radio" tabindex="0"></i>
                </div>
                <textarea id="commentInput" class="form-control mb-2" rows="2" maxlength="1000" placeholder="Nhập nhận xét hoặc câu hỏi về tài liệu này..." required></textarea>
                <button type="submit" id="btnReview" class="btn btn-brand btn-sm px-4">Gửi đánh giá</button>
            </form>
            <div id="reviewDone" class="alert alert-success py-2 small d-none">Bạn đã đánh giá tài liệu này. Cảm ơn bạn!</div>

            <div id="reviewsList"><p class="text-muted small mb-0">Chưa có đánh giá nào.</p></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="common.js"></script>
    <script>
        const lectureId = new URLSearchParams(location.search).get('id');
        let currentStars = 5;
        let currentUser = null;
        const isAdmin = () => currentUser && ['master_admin', 'admin'].includes(currentUser.role);

        function setStars(n) {
            currentStars = n;
            document.querySelectorAll('#starPicker i').forEach((s, idx) => {
                s.className = 'fa fa-star ' + (idx < n ? 'text-warning' : 'text-secondary');
            });
        }
        document.querySelectorAll('#starPicker i').forEach((star) => {
            star.addEventListener('click', () => setStars(Number(star.dataset.value)));
        });

        function renderFilePreview(item) {
            const area = document.getElementById('renderArea');
            const fileUrl = safeUrl(item.file_url);
            const type = String(item.file_type || '').toLowerCase();
            
            if (!fileUrl) { area.innerHTML = '<p class="text-muted my-4">Tài liệu chưa có tệp đính kèm hoặc đường dẫn hợp lệ.</p>'; return; }
            const u = escapeHtml(fileUrl);
            const download = `<a href="${u}" target="_blank" rel="noopener" class="btn btn-primary px-4 rounded-pill shadow-sm"><i class="fa fa-download me-2"></i> Tải xuống tệp gốc</a>`;

            if (type === 'url') {
                area.innerHTML = `
                    <div class="p-5 bg-light border rounded text-center shadow-sm">
                        <i class="fa fa-link text-info fa-4x mb-3"></i>
                        <h3 class="h5 fw-bold mb-3">Liên kết tài liệu ngoài</h3>
                        <p class="text-muted mb-4">Tài liệu này được liên kết từ một nguồn bên ngoài.</p>
                        <a href="${u}" target="_blank" rel="noopener" class="btn btn-info px-4 rounded-pill shadow-sm text-white">
                            <i class="fa fa-external-link-alt me-2"></i> Mở liên kết tài liệu
                        </a>
                    </div>`;
            } else if (['mp4', 'mov', 'webm'].includes(type)) {
                area.innerHTML = `<video controls class="w-100 rounded shadow" style="max-height: 500px; background: #000;"><source src="${u}" type="video/mp4">Trình duyệt của bạn không hỗ trợ phát video.</video>`;
            } else if (['jpg', 'jpeg', 'png', 'webp'].includes(type)) {
                area.innerHTML = `<img src="${u}" alt="Hình ảnh tài liệu" class="img-fluid rounded shadow" style="max-height: 550px;"><div class="mt-4">${download}</div>`;
            } else if (type === 'pdf') {
                area.innerHTML = `<iframe src="${u}" class="preview-frame border rounded shadow-sm" title="Xem PDF"></iframe><div class="mt-3">${download}</div>`;
            } else if (['doc', 'docx', 'ppt', 'pptx', 'xls', 'xlsx', 'csv'].includes(type)) {
                const viewer = 'https://view.officeapps.live.com/op/embed.aspx?src=' + encodeURIComponent(fileUrl);
                let icon = 'fa-file-word text-primary';
                if (type.startsWith('ppt')) icon = 'fa-file-powerpoint text-danger';
                else if (type.startsWith('xls') || type === 'csv') icon = 'fa-file-excel text-success';
                
                area.innerHTML = `
                    <iframe src="${escapeHtml(viewer)}" class="preview-frame border rounded shadow-sm" title="Xem trước tài liệu"></iframe>
                    <p class="small text-muted mt-3 mb-2"><i class="fa ${icon} me-1"></i> Nếu khung xem trước không hiển thị, hãy tải tệp về và mở trên máy tính.</p>
                    ${download}`;
            } else {
                area.innerHTML = `<div class="p-5 bg-light border rounded text-center"><i class="fa fa-file text-secondary fa-4x mb-3"></i>
                    <h3 class="h5 fw-bold mb-3">Tệp .${escapeHtml(type.toUpperCase())}</h3>${download}</div>`;
            }
        }

        function renderReviews(ratings) {
            const list = document.getElementById('reviewsList');
            if (!ratings || !ratings.length) { list.innerHTML = '<p class="text-muted small mb-0">Chưa có đánh giá nào.</p>'; return; }
            list.innerHTML = ratings.map((r) => `
                <div class="border-bottom pb-2 mb-2 position-relative">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <b class="text-dark small"><i class="fa fa-user-circle me-1"></i> ${escapeHtml(r.author)}</b>
                            <span class="text-muted small ms-2">${escapeHtml(r.created_at)}</span>
                            <div class="text-warning small mt-1">${'⭐'.repeat(Math.min(5, Math.max(0, Number(r.stars) || 0)))}</div>
                        </div>
                        ${isAdmin() ? `<button type="button" class="btn btn-outline-danger btn-sm rounded-pill fw-bold" onclick="deleteReview(${r.id})" title="Xóa đánh giá này"><i class="fa fa-trash"></i></button>` : ''}
                    </div>
                    <p class="mb-0 small text-secondary mt-2" style="white-space: pre-wrap;">${escapeHtml(r.comment)}</p>
                </div>`).join('');
        }

        function deleteReview(reviewId) {
            showConfirm('Xóa đánh giá', 'Bạn có chắc chắn muốn xóa đánh giá này?', async () => {
                try {
                    await api(`/api/lectures/${encodeURIComponent(lectureId)}/reviews/${encodeURIComponent(reviewId)}`, { method: 'DELETE' });
                    notify('Đã xóa đánh giá.', 'success', 3000);
                    await loadLectureDetail(false);
                } catch (err) { notify(err.message); }
            });
        }

        async function loadLectureDetail(countView = true) {
            try {
                const item = await api(`/api/lectures/${encodeURIComponent(lectureId)}?count_view=${countView ? 1 : 0}`);
                document.title = item.title + ' - Cổng Tiểu Học';
                
                if (item.grade) {
                    document.getElementById('gradeBadge').textContent = `Khối ${item.grade}`;
                    document.getElementById('gradeBadge').classList.remove('d-none');
                } else {
                    document.getElementById('gradeBadge').textContent = `Dùng chung toàn khối`;
                    document.getElementById('gradeBadge').classList.remove('d-none');
                    document.getElementById('gradeBadge').classList.replace('bg-primary', 'bg-secondary');
                }
                
                if (!item.subject) document.getElementById('subjectDisplay').textContent = 'Chung (Không chỉ định)';
                else document.getElementById('subjectDisplay').textContent = item.subject;

                const weekCol = document.getElementById('weekCol');
                if (item.week_start || item.week_end) {
                    weekCol.style.display = 'block';
                    if (item.week_start && item.week_end && item.week_start !== item.week_end) 
                        document.getElementById('weekDisplay').textContent = `Tuần ${item.week_start} - ${item.week_end}`;
                    else 
                        document.getElementById('weekDisplay').textContent = `Tuần ${item.week_start || item.week_end}`;
                } else {
                    weekCol.style.display = 'none';
                }

                document.getElementById('categoryBadge').textContent = CATEGORY_LABELS[item.category_type] || 'Tài liệu';
                document.getElementById('docTitle').textContent = item.title;
                document.getElementById('authorDisplay').textContent = item.author_name;
                document.getElementById('dateDisplay').textContent = new Date(item.created_at).toLocaleDateString('vi-VN');
                document.getElementById('viewsDisplay').innerHTML = `<i class="fa fa-eye"></i> ${Number(item.views_count) || 0} lượt xem`;
                
                const hasRatings = item.ratings && item.ratings.length > 0;
                document.getElementById('avgRatingDisplay').textContent = hasRatings ? `⭐ ${Number(item.avg_rating).toFixed(1)}` : 'Chưa có đánh giá';
                document.getElementById('descDisplay').textContent = item.description || 'Không có mô tả chi tiết.';

                // Cập nhật trạng thái nút Bookmark
                const icon = document.getElementById('bookmarkIconView');
                icon.className = item.is_bookmarked ? 'fa fa-heart fa-solid text-danger' : 'fa fa-heart fa-regular text-secondary';

                if (countView) renderFilePreview(item);
                renderReviews(item.ratings);
                document.getElementById('reviewForm').classList.toggle('d-none', item.already_reviewed);
                document.getElementById('reviewDone').classList.toggle('d-none', !item.already_reviewed);
            } catch (e) {
                if (e.status === 401) return;
                notify(e.message);
                if (e.status === 404) setTimeout(() => location.replace('index.html'), 1500);
            }
        }

        document.getElementById('reviewForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnReview');
            setBusy(btn, true, 'Đang gửi...');
            try {
                await api(`/api/lectures/${encodeURIComponent(lectureId)}/reviews`, {
                    method: 'POST',
                    json: { stars: currentStars, comment: document.getElementById('commentInput').value }
                });
                document.getElementById('commentInput').value = '';
                notify('Đã gửi đánh giá. Cảm ơn bạn!', 'success', 3000);
                await loadLectureDetail(false);
            } catch (err) {
                notify(err.message);
            }
            setBusy(btn, false);
        });

        // Báo lỗi tài liệu
        document.getElementById('btnReport').addEventListener('click', () => {
            showConfirm('Báo cáo tài liệu lỗi', 'Nếu tài liệu này bị hỏng link, không xem được nội dung hoặc có nội dung không phù hợp, hãy gửi báo cáo để Ban quản trị xử lý nhé.', async () => {
                try {
                    await api(`/api/lectures/${encodeURIComponent(lectureId)}/report`, { method: 'POST' });
                    notify('Đã gửi báo cáo lỗi thành công! Cảm ơn bạn.', 'success', 5000);
                } catch(e) { notify(e.message); }
            }, 'Gửi báo cáo', 'warning');
        });

        // Nút Bookmark ở trang chi tiết
        document.getElementById('btnBookmarkView').addEventListener('click', async () => {
            const icon = document.getElementById('bookmarkIconView'); 
            icon.className = 'fa fa-spinner fa-spin text-secondary';
            try {
                const res = await api(`/api/lectures/${encodeURIComponent(lectureId)}/bookmark`, { method: 'POST' });
                icon.className = res.is_bookmarked ? 'fa fa-heart fa-solid text-danger' : 'fa fa-heart fa-regular text-secondary';
                if(res.is_bookmarked) notify('Đã thêm vào mục Tài liệu đã lưu!', 'success', 2000);
                else notify('Đã xóa khỏi mục Tài liệu đã lưu!', 'info', 2000);
            } catch(err) { notify(err.message); icon.className = 'fa fa-heart fa-regular text-secondary'; }
        });

        (async function init() {
            if (!lectureId) { location.replace('index.html'); return; }
            currentUser = await requireUser();
            if (!currentUser) return;
            
            document.getElementById('userBadge').textContent = `Xin chào, ${currentUser.name}`;
            setStars(5);
            loadLectureDetail(true);
        })();
    </script>
</body>
</html>
