<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Cổng Tiểu Học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="common.css" rel="stylesheet">
</head>
<body class="auth-body">
    <main class="container py-4">
        <div class="card auth-card shadow-lg p-4 mx-auto bg-white">
            <div class="text-center mb-4">
                <span class="fs-1" aria-hidden="true">📚</span>
                <h1 class="h4 fw-bold auth-title mt-2">CỔNG TIỂU HỌC</h1>
            </div>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">Email</label>
                    <input type="email" id="email" class="form-control" required autocomplete="username" placeholder="nhapemail@gmail.com">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-bold">Mật khẩu</label>
                    <input type="password" id="password" class="form-control" required autocomplete="current-password" placeholder="••••••••">
                    <div class="text-end mt-1"><a href="forgot.html" class="small text-decoration-none">Quên mật khẩu?</a></div>
                </div>
                <button type="submit" id="btnLogin" class="btn btn-brand w-100 py-2 fw-bold mt-2">Đăng nhập</button>
            </form>
            <div class="text-center mt-3 small">
                Chưa có tài khoản? <a href="register.html" class="fw-bold">Đăng ký thành viên mới</a>
            </div>
        </div>
    </main>
    <script src="common.js"></script>
    <script>
        // Đã đăng nhập sẵn thì vào thẳng trang chủ
        api('/api/me', { redirectOn401: false }).then(() => location.replace('index.html')).catch(() => {});

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            setBusy(btn, true, 'Đang đăng nhập...');
            try {
                const { user } = await api('/api/auth/login', {
                    method: 'POST', redirectOn401: false,
                    json: { email: document.getElementById('email').value, password: document.getElementById('password').value }
                });
                localStorage.setItem('user', JSON.stringify(user));
                location.href = 'index.html';
            } catch (err) {
                notify(err.message);
                setBusy(btn, false);
            }
        });
    </script>
</body>
</html>
