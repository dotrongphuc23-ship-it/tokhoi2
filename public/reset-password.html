<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đặt Lại Mật Khẩu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
    <div class="container" style="max-width: 420px;">
        <div class="card shadow p-4 border-0 rounded-4">
            <h4 class="text-center fw-bold text-primary mb-3">MẬT KHẨU MỚI</h4>
            <form id="resetForm">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nhập mật khẩu mới</label>
                    <input type="password" id="new_password" class="form-control" required placeholder="Tối thiểu 6 ký tự">
                </div>
                <button type="submit" class="btn btn-success w-100 py-2">Lưu mật khẩu mới</button>
            </form>
        </div>
    </div>
    <script>
        const token = new URLSearchParams(window.location.search).get('token');
        document.getElementById('resetForm').onsubmit = async (e) => {
            e.preventDefault();
            const res = await fetch('/api/auth/reset-password', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, new_password: document.getElementById('new_password').value })
            });
            const data = await res.json();
            if (res.ok) { alert(data.message); window.location.href = 'login.html'; } else alert(data.error);
        };
    </script>
</body>
</html>
